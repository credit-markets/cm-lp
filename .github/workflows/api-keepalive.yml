name: API keep-alive

# "Launch app" depends on the backend at api.credit.markets. Its free host
# sleeps after 15 idle minutes and the free database pauses after a quiet week.
# The readiness route queries the database, so one request keeps both awake,
# and a failed run is the alert that the app is down.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check API readiness
        run: >
          curl --fail --silent --show-error
          --retry 4 --retry-delay 20 --retry-all-errors --max-time 60
          https://api.credit.markets/health/ready
